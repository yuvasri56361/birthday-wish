<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="floating-hearts">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>

    <script>
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

async function toggleMusic() {
    try {
        if (music.paused) {
            await music.play();
            musicBtn.innerHTML = "⏸ Pause Music";
        } else {
            music.pause();
            musicBtn.innerHTML = "🎵 Play Music";
        }
    } catch (error) {
        console.error("Music playback error:", error);
    }
}
</script>

    <main class="login-container">

        <div class="heart-icon" title="Click me for love ❤️">♥</div>

        <h1>Welcome My Love</h1>

        <p class="subtitle">
            A little surprise is waiting for you...
        </p>

        <div class="login-card">

            <h2>💗 Only For You 💗</h2>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your name"
                    autocomplete="username"
                    required
                >

                <p class="clue">
                    💡 Clue: It's the name of the most handsome person I know.
                </p>

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter the special word"
                    autocomplete="current-password"
                    required
                >

                <p class="clue">
                    💡 Clue: What I call you most lovingly. 🤭
                </p>

                <button type="submit" class="pink-button">
                    Enter My Heart ❤️
                </button>

                <p id="loginMessage" class="error-message"></p>

            </form>

        </div>

        <p class="bottom-text">
            Made with endless love ❤️
        </p>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
